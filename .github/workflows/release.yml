name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate manifest
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          tag = os.environ["TAG"].strip()
          manifest = json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          if manifest.get("schemaVersion") != 1:
              fail("manifest.json: schemaVersion must be 1")

          plugin_id = str(manifest.get("id", "")).strip()
          version = str(manifest.get("version", "")).strip()
          if not plugin_id or not version:
              fail("manifest.json: id and version are required")

          def segments(value):
              value = value.strip().lstrip("vV")
              parts = value.split(".")
              if not 1 <= len(parts) <= 3 or not all(part.isdigit() for part in parts):
                  fail(f"unsupported version format: {value}")
              return tuple(int(part) for part in parts + ["0"] * (3 - len(parts)))

          if segments(tag) != segments(version):
              fail(f"tag {tag} does not match manifest version {version}")

          entry = manifest.get("entry") or {}
          for kind in ("web", "lua", "native"):
              path = entry.get(kind)
              if path and not pathlib.Path(path).is_file():
                  fail(f"manifest entry.{kind} points to a missing file: {path}")
          if not any(entry.get(kind) for kind in ("web", "lua", "native")):
              fail("manifest.json: one of entry.web, entry.lua, entry.native is required")

          print(f"plugin: {plugin_id} {version} (tag {tag})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"id={plugin_id}\n")
              output.write(f"version={version}\n")
              output.write(f"package={plugin_id}-{version}.zip\n")
          PY

      - name: Package plugin
        env:
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          set -euo pipefail
          mkdir -p dist
          files=(manifest.json)
          for dir in web lua native; do
            if [ -d "$dir" ]; then files+=("$dir"); fi
          done
          rm -f "dist/$PACKAGE"
          zip -qr "dist/$PACKAGE" "${files[@]}"
          unzip -l "dist/$PACKAGE"
          (cd dist && sha256sum "$PACKAGE" > SHA256SUMS && cat SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          set -euo pipefail
          args=()
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$PACKAGE" dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" "dist/$PACKAGE" dist/SHA256SUMS \
              --title "$TAG" --generate-notes --verify-tag "${args[@]}"
          fi
